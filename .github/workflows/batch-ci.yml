# BATCH-FS1-GOV-001 — approved batch only (label-gated). No per-PR CI.
name: Batch CI (approved)

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: batch-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  batch:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'batch-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: FS-76 secret scan (tracked and built artifacts)
        run: node --test scripts/ci/secret-scan.test.mjs && node scripts/ci/secret-scan.mjs --require-built
      - name: Lint
        run: pnpm lint
      - name: Cross-tenant matrix (STACK-03)
        run: pnpm test:cross-tenant
      - name: Test
        run: pnpm test
      - name: FS-128 FS-MIGRATE import pipeline contracts
        run: pnpm test:fs-migrate-import-contracts
      - name: FS-152 golden import e2e wiring
        run: pnpm test:golden-import-e2e-wiring

  neon-per-pr-staging:
    name: Neon per-PR (staging RLS)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'batch-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: batch
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Build packages for CI scripts
        run: pnpm --filter @fsm/import-normalize build && pnpm --filter @fsm/types build && pnpm --filter @fsm/import-engine build && pnpm --filter "@fsm/config..." --filter "@fsm/db..." build
      - name: Neon per-PR branch gate (STACK-10)
        env:
          NEON_CI_DATABASE_URL: ${{ secrets.NEON_CI_STAGING_DATABASE_URL }}
          RENVANI_DEPLOYMENT_TIER: staging
        run: node scripts/ci/neon-per-pr-branch.mjs
      - name: FS-152 golden import e2e (QBD + Service Fusion)
        env:
          NEON_CI_DATABASE_URL: ${{ secrets.NEON_CI_STAGING_DATABASE_URL }}
          RENVANI_DEPLOYMENT_TIER: staging
        run: node scripts/ci/golden-import-e2e.mjs
      - name: Neon CI wiring contract test
        run: node --test scripts/ci/neon-per-pr-branch.test.mjs
      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 414 && github.event.pull_request.head.ref == 'codex/growth-trade-inquiry' && github.event.pull_request.base.ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          node-version: 22.16.0
          cache: pnpm
      - name: FS-229 strict inquiry concurrency (isolated staging PostgreSQL)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 414 && github.event.pull_request.head.ref == 'codex/growth-trade-inquiry' && github.event.pull_request.base.ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          NEON_CI_DATABASE_URL: ${{ secrets.NEON_CI_STAGING_DATABASE_URL }}
          RENVANI_DEPLOYMENT_TIER: staging
          FS229_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node --test scripts/ci/fs229-revenue-inquiry-postgres.test.mjs
          pnpm --filter @fsm/api... build
          node scripts/ci/fs229-revenue-inquiry-postgres.mjs

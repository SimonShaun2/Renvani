name: PR 447 verified website checkpoint
on:
  push:
    branches: [design/reference-led-subpages-v2]
    paths: [.github/workflows/pr447-asset-checkpoint.yml]
permissions:
  contents: write
jobs:
  checkpoint:
    if: github.repository == 'SimonShaun2/Renvani' && github.event.head_commit.message == 'Checkpoint PR 447 verified brand, screen and form files'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Import the exact reviewed source and static assets
        env:
          EXPECTED_PARENT: 94d302db7bf57f9d8ebcbc659ffc39566704a360
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          curl --fail --silent --show-error --location --max-time 60 --retry 2 'https://sb-6ruxbbn71rpn.vercel.run/pr447/brand-screens-forms.tar.gz' -o /tmp/website-checkpoint.tar.gz
          echo '978f996b700f74167c425b9d9e41de99c0b50a352bc3a4cbb905bdd7a82f73e3  /tmp/website-checkpoint.tar.gz' | sha256sum --check
          python3 - <<'PY'
          import pathlib, tarfile
          root = pathlib.Path.cwd().resolve()
          with tarfile.open('/tmp/website-checkpoint.tar.gz') as archive:
              members = archive.getmembers()
              assert len(members) == 34, 'Unexpected file count'
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  assert member.isfile() and not path.is_absolute() and '..' not in path.parts
                  assert path.parts[0] in ('apps', 'packages', 'docs') and '.env' not in path.name
                  destination = root / path
                  assert destination.resolve().is_relative_to(root)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(archive.extractfile(member).read())
                  destination.chmod(0o644)
          PY
          git diff --check
          git add -- apps packages docs/design/pr447-brand-screens-forms.md
          git config user.name 'Renvani Build Assistant'
          git config user.email 'renvani-build@users.noreply.github.com'
          git commit -m 'Apply supplied branding, Figma feature screens and seven-field lead forms'
          git push origin HEAD:refs/heads/design/reference-led-subpages-v2
